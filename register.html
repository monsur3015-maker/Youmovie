<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>YouMovie - Create Account</title>

    <link
        rel="stylesheet"
        href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <div
            class="logo"
            onclick="location.href='index.html'">

            ▶ YouMovie

        </div>

    </header>


    <!-- REGISTER PAGE -->
    <main class="account-page">

        <!-- LOGO -->
        <div class="account-logo">
            ▶
        </div>


        <!-- TITLE -->
        <h1>
            Create Your Account
        </h1>

        <p class="account-subtitle">
            Join YouMovie today
        </p>


        <!-- REGISTER FORM -->
        <div class="account-form">

            <!-- USERNAME -->
            <label for="registerUsername">
                Username
            </label>

            <input
                id="registerUsername"
                type="text"
                placeholder="Choose a username"
                autocomplete="username">


            <!-- EMAIL -->
            <label for="registerEmail">
                Email
            </label>

            <input
                id="registerEmail"
                type="email"
                placeholder="Enter your email"
                autocomplete="email">


            <!-- PASSWORD -->
            <label for="registerPassword">
                Password
            </label>

            <input
                id="registerPassword"
                type="password"
                placeholder="Create a password"
                autocomplete="new-password">


            <!-- CONFIRM PASSWORD -->
            <label for="registerConfirm">
                Confirm Password
            </label>

            <input
                id="registerConfirm"
                type="password"
                placeholder="Confirm your password"
                autocomplete="new-password">


            <!-- CREATE ACCOUNT -->
            <button
                id="registerButton"
                class="account-button">

                Create Account

            </button>


            <!-- MESSAGE -->
            <p
                id="registerMessage"
                class="account-message">
            </p>

        </div>


        <!-- SIGN IN -->
        <p class="already-account">

            Already have an account?

            <a href="account.html">
                Sign In
            </a>

        </p>


        <!-- TERMS -->
        <p class="terms">

            By creating an account, you agree to
            YouMovie's Terms and Privacy Policy.

        </p>

    </main>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

        <!-- HOME -->
        <div
            class="nav-item"
            onclick="location.href='index.html'">

            <span>
                ⌂
            </span>

            Home

        </div>


        <!-- SHORTS -->
        <div
            class="nav-item"
            onclick="location.href='shorts.html'">

            <span>
                ▣
            </span>

            Shorts

        </div>


        <!-- CREATE -->
        <div
            class="nav-item"
            onclick="location.href='upload.html'">

            <span>
                ＋
            </span>

            Create

        </div>


        <!-- SUBSCRIPTIONS -->
        <div class="nav-item">

            <span>
                ▤
            </span>

            Subscriptions

        </div>


        <!-- YOU -->
        <div
            class="nav-item active"
            onclick="location.href='account.html'">

            <span>
                ●
            </span>

            You

        </div>

    </nav>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- SUPABASE CONFIG -->
    <script>

        const SUPABASE_URL =
            "https://ajanpecdofburxsimyjt.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_fysaC9xU6_NQgAsnjib_qw_BMbVRftN";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );

    </script>


    <!-- REGISTER -->
    <script>

        const registerButton =
            document.getElementById("registerButton");

        registerButton.addEventListener(
            "click",
            async function () {

                const username =
                    document
                    .getElementById("registerUsername")
                    .value
                    .trim();

                const email =
                    document
                    .getElementById("registerEmail")
                    .value
                    .trim();

                const password =
                    document
                    .getElementById("registerPassword")
                    .value;

                const confirm =
                    document
                    .getElementById("registerConfirm")
                    .value;

                const message =
                    document.getElementById(
                        "registerMessage"
                    );


                /* VALIDATION */

                if (
                    !username ||
                    !email ||
                    !password ||
                    !confirm
                ) {

                    message.textContent =
                        "Please fill in all fields.";

                    return;
                }


                if (username.length < 3) {

                    message.textContent =
                        "Username must be at least 3 characters.";

                    return;
                }


                if (password.length < 6) {

                    message.textContent =
                        "Password must be at least 6 characters.";

                    return;
                }


                if (password !== confirm) {

                    message.textContent =
                        "Passwords do not match.";

                    return;
                }


                /* BUTTON */

                registerButton.disabled = true;

                registerButton.textContent =
                    "Creating Account...";


                /* SUPABASE SIGN UP */

                const {
                    data,
                    error
                } = await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {

                            username: username

                        }

                    }

                });


                /* ERROR */

                if (error) {

                    message.textContent =
                        error.message;

                    registerButton.disabled =
                        false;

                    registerButton.textContent =
                        "Create Account";

                    return;
                }


                /* SUCCESS */

                if (data.user) {

                    message.textContent =
                        "Account created successfully!";

                    registerButton.textContent =
                        "Account Created";

                    setTimeout(function () {

                        location.href =
                            "account.html";

                    }, 1500);

                }

            }
        );

    </script>

</body>

</html>
