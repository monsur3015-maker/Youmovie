<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>YouMovie - Shorts</title>

    <link
        rel="stylesheet"
        href="style.css">
</head>

<body class="shorts-body">

    <!-- SHORTS HEADER -->
    <header class="shorts-header">

        <div
            class="logo"
            onclick="location.href='index.html'">
            ▶ YouMovie
        </div>

        <div style="margin-left:auto;">
            <button
                onclick="location.href='index.html'"
                style="
                    background:#272727;
                    color:white;
                    border:none;
                    padding:8px 14px;
                    border-radius:18px;
                    cursor:pointer;
                ">
                ✕
            </button>
        </div>

    </header>


    <!-- SHORTS FEED -->
    <main class="shorts-feed">


        <!-- SHORT 1 -->
        <section class="short">

            <video
                class="short-video"
                controls
                loop
                playsinline
                poster="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=900&q=80">

                <source
                    src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
                    type="video/mp4">

                Your browser does not support
                video playback.

            </video>


            <!-- SHORT INFO -->
            <div class="short-info">

                <div class="short-channel">
                    @TechWorld
                </div>

                <p>
                    Discover amazing technology
                    and new ideas 🚀
                </p>

                <p style="color:#aaa; margin-top:8px;">
                    #technology #future #YouMovie
                </p>

            </div>


            <!-- SHORT ACTIONS -->
            <div class="short-actions">

                <button>
                    👍
                </button>

                <button>
                    💬
                </button>

                <button>
                    ↗
                </button>

                <button>
                    🔖
                </button>

            </div>

        </section>



        <!-- SHORT 2 -->
        <section class="short">

            <video
                class="short-video"
                controls
                loop
                playsinline
                poster="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=900&q=80">

                <source
                    src="https://www.w3schools.com/html/mov_bbb.mp4"
                    type="video/mp4">

                Your browser does not support
                video playback.

            </video>


            <!-- SHORT INFO -->
            <div class="short-info">

                <div class="short-channel">
                    @MusicWorld
                </div>

                <p>
                    Music that makes your day
                    better 🎵
                </p>

                <p style="color:#aaa; margin-top:8px;">
                    #music #shorts #YouMovie
                </p>

            </div>


            <!-- SHORT ACTIONS -->
            <div class="short-actions">

                <button>
                    👍
                </button>

                <button>
                    💬
                </button>

                <button>
                    ↗
                </button>

                <button>
                    🔖
                </button>

            </div>

        </section>



        <!-- SHORT 3 -->
        <section class="short">

            <video
                class="short-video"
                controls
                loop
                playsinline
                poster="https://images.unsplash.com/photo-1516321497487-e288fb19713f?auto=format&fit=crop&w=900&q=80">

                <source
                    src="https://www.w3schools.com/html/movie.mp4"
                    type="video/mp4">

                Your browser does not support
                video playback.

            </video>


            <!-- SHORT INFO -->
            <div class="short-info">

                <div class="short-channel">
                    @EducationHub
                </div>

                <p>
                    Learn something new every day 📚
                </p>

                <p style="color:#aaa; margin-top:8px;">
                    #education #learning #shorts
                </p>

            </div>


            <!-- SHORT ACTIONS -->
            <div class="short-actions">

                <button>
                    👍
                </button>

                <button>
                    💬
                </button>

                <button>
                    ↗
                </button>

                <button>
                    🔖
                </button>

            </div>

        </section>


    </main>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

        <div
            class="nav-item"
            onclick="location.href='index.html'">

            <span>⌂</span>

            Home

        </div>


        <div
            class="nav-item active"
            onclick="location.href='shorts.html'">

            <span>▣</span>

            Shorts

        </div>


        <div
            class="nav-item"
            onclick="location.href='upload.html'">

            <span>＋</span>

            Create

        </div>


        <div class="nav-item">

            <span>▤</span>

            Subscriptions

        </div>


        <div
            class="nav-item"
            onclick="location.href='account.html'">

            <span>●</span>

            You

        </div>

    </nav>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
